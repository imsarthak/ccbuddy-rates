name: Probe Myntra surfaces

# Throwaway measurement rig. Myntra hands www.myntra.com/gold-coins a
# 483-byte "Site Maintenance" page to every datacenter egress measured so
# far — EXCEPT, from a GitHub runner (Microsoft AS8075), a request carrying
# the bingbot user-agent, which gets the real 691 KB page. This round asks
# what the allowlist actually keys on: the literal string "bingbot", any
# self-identified crawler, or something else. The answer decides whether a
# cloud-hosted watcher can identify itself honestly.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: User-agent matrix
        run: |
          U="https://www.myntra.com/gold-coins"
          probe () {
            label="$1"; ua="$2"
            out=$(curl -s -o /tmp/o.bin -w '%{http_code} %{size_download}' --max-time 25 -A "$ua" "$U" || echo "CURLFAIL 0")
            myx=$(grep -c 'window.__myx' /tmp/o.bin 2>/dev/null || echo 0)
            verdict=$(if [ "$myx" -gt 0 ]; then echo "REAL PAGE"; else echo "blocked"; fi)
            printf '%-40s %-14s __myx=%-3s %s\n' "$label" "$out" "$myx" "$verdict"
            sleep 2
          }

          echo "--- controls"
          probe "chrome"                 "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36"
          probe "bingbot (known pass)"   "Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)"

          echo "--- does it key on the literal string, or on any crawler?"
          probe "bingbot bare token"     "bingbot"
          probe "BINGBOT uppercase"      "BINGBOT/2.0"
          probe "bingbot-ish but not"    "Mozilla/5.0 (compatible; bingbat/2.0; +http://www.bing.com/bingbot.htm)"

          echo "--- honest self-identifying crawlers (what we would like to send)"
          probe "ccbuddy plain"          "CCBuddyRatesBot/1.0 (+https://github.com/imsarthak/ccbuddy-rates)"
          probe "ccbuddy compatible"     "Mozilla/5.0 (compatible; CCBuddyRatesBot/1.0; +https://github.com/imsarthak/ccbuddy-rates)"
          probe "generic bot word"       "Mozilla/5.0 (compatible; SomeBot/1.0; +https://example.com/bot)"
          probe "the word crawler"       "Mozilla/5.0 (compatible; ExampleCrawler/1.0)"

          echo "--- other named crawlers (is it a general crawler allowlist?)"
          probe "googlebot"              "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          probe "yandexbot"              "Mozilla/5.0 (compatible; YandexBot/3.0; +http://yandex.com/bots)"
          probe "ahrefsbot"              "Mozilla/5.0 (compatible; AhrefsBot/7.0; +http://ahrefs.com/robot/)"
          probe "duckduckbot"            "DuckDuckBot/1.1; (+http://duckduckgo.com/duckduckbot.html)"
          probe "applebot"               "Mozilla/5.0 (compatible; Applebot/0.1; +http://www.apple.com/go/applebot)"

          echo "--- no UA at all"
          probe "curl default"           "curl/8.5.0"
          probe "empty"                  ""
